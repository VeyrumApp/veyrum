name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest]
        include:
          # Child-process tracing is native code: build and test it on arm64 too.
          - node: 22
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Test
        if: matrix.node != 24
        run: pnpm exec vitest run --maxWorkers=2
      # The packed packages, installed into fresh Vitest and Jest projects as a user would.
      - name: Package smoke test
        if: matrix.node != 24
        run: node scripts/pack-smoke.mjs
      - name: Package smoke test (oldest supported runners)
        if: matrix.node != 24
        run: node scripts/pack-smoke.mjs
        env:
          SMOKE_VITEST: 4.0.18
          SMOKE_JEST: 29.7.0
      # Veyrum runs its own suite in shadow mode: everything runs, the job summary reports what it
      # would have reused and whether any of that fails.
      - name: Restore Veyrum evidence
        if: matrix.node == 24
        uses: actions/cache@v4
        with:
          path: .veyrum/store.sqlite
          key: veyrum-${{ runner.os }}-node24-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            veyrum-${{ runner.os }}-node24-${{ github.ref_name }}-
            veyrum-${{ runner.os }}-node24-${{ github.base_ref || github.event.repository.default_branch }}-
      - name: Test (Veyrum shadow mode)
        if: matrix.node == 24
        run: node packages/cli/dist/main.js run --full --audit --max-workers 2 --summary "$GITHUB_STEP_SUMMARY"
