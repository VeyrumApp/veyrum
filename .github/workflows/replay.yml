name: Replay

# Replays corpora (bench/corpora/<name>.json) on dedicated runners. Each corpus's commit range is
# pinned once, then split into shards that replay in parallel, each window after its own warm-up
# commit; a merge job per corpus combines the shards into one report.
on:
  workflow_dispatch:
    inputs:
      corpora:
        description: JSON array of corpus names, for example ["vue-core", "date-fns"]
        default: '["vue-core"]'
      preset:
        description: "full: the corpus defaults and the inputs below. quick: 10 commits, 2 mutants each, one shard per corpus (about 30-40 minutes), for iterating; inputs below still override"
        type: choice
        options: [full, quick]
        default: full
      shards:
        description: Parallel shards per corpus (empty for the preset's)
        default: ''
      commits:
        description: Commits to replay (empty for the corpus default)
        default: ''
      until:
        description: Commit to end at (empty for the branch head; use with a single corpus)
        default: ''
      mutants-per-commit:
        description: Mutants per sampled commit (empty for the corpus default)
        default: ''
      mutation-every:
        description: Sample mutants every Nth commit (empty for the corpus default)
        default: ''
      overhead-every:
        description: Measure capture overhead every Nth commit (empty for the preset's; quick measures every commit)
        default: ''
      node-profile:
        description: CPU-profile every Node process of the plain and Veyrum runs on the first two measured commits (diagnostics; changes the runtime key, so selection results after them are skewed)
        type: boolean
        default: false
      cpu-profile:
        description: Write a CPU profile of every capture window (diagnostics; use a short range)
        type: boolean
        default: false


# Replays execute third-party code (every commit's install scripts and tests), so the workflow
# token is read-only and never left in the checkout.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          CORPORA: ${{ inputs.corpora }}
          PRESET: ${{ inputs.preset }}
          SHARDS: ${{ inputs.shards }}
          UNTIL: ${{ inputs.until }}
          COMMITS: ${{ inputs.commits }}
          MUTANTS: ${{ inputs.mutants-per-commit }}
          EVERY: ${{ inputs.mutation-every }}
          OVERHEAD: ${{ inputs.overhead-every }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs"
            import { execFileSync } from "node:child_process"
            const quick = process.env.PRESET === "quick"
            const pick = (value, preset) => value || (quick ? preset : "")
            const settings = {
              shards: Number(pick(process.env.SHARDS, "1") || "4"),
              commits: pick(process.env.COMMITS, "10"),
              mutants: pick(process.env.MUTANTS, "2"),
              every: pick(process.env.EVERY, "1"),
              overhead: pick(process.env.OVERHEAD, "1") || "4",
            }
            const include = []
            for (const name of JSON.parse(process.env.CORPORA)) {
              const corpus = JSON.parse(fs.readFileSync(`bench/corpora/${name}.json`, "utf8"))
              // Pin the range once so every shard replays the same history.
              const until = process.env.UNTIL || corpus.until ||
                execFileSync("git", ["ls-remote", corpus.repo, `refs/heads/${corpus.branch}`], { encoding: "utf8" }).split("\t")[0]
              for (let shard = 0; shard < settings.shards; shard++) include.push({ corpus: name, shard, until, ...settings })
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
            console.log(JSON.stringify(include, null, 2))
          '

  replay:
    name: replay (${{ matrix.corpus }} ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Replay
        shell: bash
        env:
          CORPUS: ${{ matrix.corpus }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          UNTIL: ${{ matrix.until }}
          COMMITS: ${{ matrix.commits }}
          MUTANTS: ${{ matrix.mutants }}
          EVERY: ${{ matrix.every }}
          OVERHEAD: ${{ matrix.overhead }}
          VEYRUM_CPU_PROFILE: ${{ inputs.cpu-profile && format('{0}/profiles', runner.temp) || '' }}
          # Diagnostic reports of every Node process in a run that hits its time limit.
          RIG_REPORT_DIR: ${{ runner.temp }}/reports
          RIG_NODE_PROFILE_DIR: ${{ inputs.node-profile && format('{0}/node-profiles', runner.temp) || '' }}
        run: |
          mkdir -p "$RIG_REPORT_DIR"
          args=(--bench "$RUNNER_TEMP/bench" --overhead-every "$OVERHEAD" --shard "$SHARD" --until "$UNTIL")
          if [ -n "$COMMITS" ]; then args+=(--commits "$COMMITS"); fi
          if [ -n "$MUTANTS" ]; then args+=(--mutants-per-commit "$MUTANTS"); fi
          if [ -n "$EVERY" ]; then args+=(--mutation-every "$EVERY"); fi
          bench/replay.sh "bench/corpora/$CORPUS.json" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.corpus }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/bench/${{ matrix.corpus }}/results.jsonl
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/profiles
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/node-profiles
          if-no-files-found: warn

  merge:
    name: report (${{ matrix.corpus }})
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        corpus: ${{ fromJSON(inputs.corpora) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.corpus }}-*
          path: ${{ runner.temp }}/shards
      - name: Report
        shell: bash
        env:
          CORPUS: ${{ matrix.corpus }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench/$CORPUS"
          cat "$RUNNER_TEMP"/shards/*/bench/"$CORPUS"/results.jsonl "$RUNNER_TEMP"/shards/*/results.jsonl 2>/dev/null \
            > "$RUNNER_TEMP/bench/$CORPUS/results.jsonl" || true
          wc -l "$RUNNER_TEMP/bench/$CORPUS/results.jsonl"
          node bench/rig/dist/main.js report "bench/corpora/$CORPUS.json" --bench "$RUNNER_TEMP/bench" > /dev/null
          cat "$RUNNER_TEMP/bench/$CORPUS/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.corpus }}
          path: ${{ runner.temp }}/bench/${{ matrix.corpus }}

  summary:
    name: summary
    needs: merge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: ${{ runner.temp }}/reports
      - name: Summary
        shell: bash
        env:
          CORPORA: ${{ join(fromJSON(inputs.corpora), ' ') }}
        run: |
          files=()
          for corpus in $CORPORA; do
            mkdir -p "$RUNNER_TEMP/bench/$corpus"
            cp "$RUNNER_TEMP/reports/replay-$corpus/results.jsonl" "$RUNNER_TEMP/bench/$corpus/" && files+=("bench/corpora/$corpus.json")
          done
          node bench/rig/dist/main.js summary "${files[@]}" --bench "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-summary
          path: ${{ runner.temp }}/summary.md
